services:
  db:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api/BillApi
    environment:
      # Toda la configuración se toma del archivo .env en la raíz
      MongoSettings__ConnectionString: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@db:27017
      MongoSettings__Database: ${MONGO_DB}
      EmailConfiguration__Host: ${SMTP_HOST}
      EmailConfiguration__Port: ${SMTP_PORT}
      EmailConfiguration__Username: ${SMTP_USERNAME}
      EmailConfiguration__Password: ${SMTP_PASSWORD}
      EmailConfiguration__From: ${SMTP_FROM:-}
    ports:
      - "${API_PORT:-5080}:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        VITE_API_URL: ${VITE_API_URL}
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      - api

volumes:
  mongo-data:
